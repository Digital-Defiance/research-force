# Continuous integration for research-collab-cms (spec task 48.4).
#
# This workflow runs ALL the mandatory PR-scope evidence, not `npm run ci` alone: lint, the spec and
# structural checks, the release check, type checks, the full test suite, the build, the guarded
# Worker deployment dry-run bundles, and the runtime launch-gate check.
#
# What this workflow deliberately does NOT run: the infrastructure acceptance suites (the 48.5
# staging verification, the independent restore rehearsal, the distributed abuse profile, the
# operating-profile certification, and the team walkthroughs). Those are the operator / CI-with-
# staging gates — they require a real deployed scope, operator-held recovery keys and provider
# access, and they are the ones the runtime launch-gate check (`check:launch`) certifies from
# recorded evidence. They never run on an ordinary pull request and this workflow adds no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-evidence:
    name: PR-scope evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint, stylelint, import boundaries, copy)
        run: npm run lint

      - name: Spec and structural checks
        run: npm run check:specs

      - name: Release check (source and migration fingerprints)
        run: npm run release:check

      - name: Type check
        run: npm run typecheck

      - name: Unit, property, and workers-pool tests
        run: npm test

      - name: Build the Workspace and public site
        run: npm run build

      - name: Guarded Worker deployment dry-run bundles
        # Dry-run only: enumerates the ordered rollout steps and launch-gate decisions. It makes no
        # account call and activates nothing; a blocked gate leaves its scope disabled.
        run: node --import tsx scripts/deploy.ts --check apps/app/wrangler.jsonc

      - name: Runtime launch-gate check
        # Reports the per-gate SATISFIED/BLOCKED status from recorded evidence. Reporting-only (no
        # scope requested) so an ordinary PR is not gated on staging acceptance evidence.
        run: npm run check:launch
